<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Playlist Web App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f8fafc; }
        .playlist-table th, .playlist-table td { vertical-align: middle; }
        .banner { font-size: 2rem; font-weight: bold; color: #2563eb; margin: 1rem 0; letter-spacing: 1px; }
        @media (max-width: 576px) {
            .banner { font-size: 1.2rem; }
            .playlist-table th, .playlist-table td { font-size: 0.9rem; }
            #mobileSongList { margin-bottom: 110px; }
            #audioBar { margin-top: 8px; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-blue-50 to-indigo-100">
<div class="container-fluid mt-3 px-2 px-sm-4 flex-grow" style="padding-bottom: 110px;">
    <div class="banner text-center mb-3 font-bold tracking-wide">🎵 Song Playlist Player 🎵</div>
    <div class="row g-2 align-items-center mb-2 justify-content-center text-center">
        <div class="col-12 col-md-auto mb-2 mb-md-0 d-flex flex-wrap gap-2 justify-content-center">
            <button class="btn flex-fill bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition-all duration-150" onclick="shuffle()">Shuffle</button>
            <button class="btn flex-fill bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-lg shadow transition-all duration-150" onclick="sortTitle()">Sort by Title</button>
            <button class="btn flex-fill bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-lg shadow transition-all duration-150" onclick="sortArtist()">Sort by Artist</button>
            <button class="btn flex-fill bg-green-500 hover:bg-green-600 text-white font-semibold rounded-lg shadow transition-all duration-150" data-bs-toggle="modal" data-bs-target="#addModal">Add Song</button>
        </div>
    </div>
    <div class="table-responsive d-none d-sm-block">
        <table class="table align-middle mb-0 bg-white rounded-xl shadow-lg overflow-hidden">
            <thead class="bg-gradient-to-r from-blue-100 to-indigo-100">
                <tr>
                    <th class="text-center font-bold text-blue-700 text-lg">#</th>
                    <th class="text-center font-bold text-blue-700 text-lg">Title</th>
                    <th class="text-center font-bold text-blue-700 text-lg">Artist</th>
                    <th class="text-center font-bold text-blue-700 text-lg">Duration</th>
                    <th class="text-center font-bold text-blue-700 text-lg">Actions</th>
                </tr>
            </thead>
            <tbody id="playlistBody" class="divide-y divide-blue-100"></tbody>
        </table>
    </div>
    <!-- Mobile song cards -->
    <div id="mobileSongList" class="d-block d-sm-none mt-2"></div>
</div>

<!-- Add Song Modal -->
<div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content rounded-xl shadow-lg">
      <div class="modal-header bg-blue-100 rounded-t-xl">
        <h5 class="modal-title font-bold text-blue-700" id="addModalLabel">Add Song</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body bg-blue-50">
        <form id="addSongForm">
          <div class="mb-3">
            <label for="title" class="form-label font-semibold">Title</label>
            <input type="text" class="form-control rounded-lg" id="title" required>
          </div>
          <div class="mb-3">
            <label for="artist" class="form-label font-semibold">Artist</label>
            <input type="text" class="form-control rounded-lg" id="artist" required>
          </div>
          <div class="mb-3">
            <label for="duration" class="form-label font-semibold">Duration (seconds)</label>
            <input type="number" class="form-control rounded-lg" id="duration" required>
          </div>
          <div class="mb-3">
            <label for="file" class="form-label font-semibold">Song File</label>
            <input type="file" class="form-control rounded-lg" id="file" accept="audio/*" required>
          </div>
          <button type="submit" class="btn w-100 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow transition-all duration-150">Add Song</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Fixed Bottom Audio Player Bar -->
<div id="audioBar" class="fixed-bottom bg-white shadow-lg p-2" style="z-index: 1050;">
  <div class="container-fluid">
    <div class="row align-items-center">
      <div class="col-12 col-md-10">
        <audio id="audioPlayer" controls class="w-full"></audio>
      </div>
      <div class="col-12 col-md-2 mt-2 mt-md-0">
        <button class="btn w-100 bg-yellow-400 hover:bg-yellow-500 text-black font-semibold rounded-lg shadow transition-all duration-150" onclick="stopSong()">Stop</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function playSong(filepath) {
    const audio = document.getElementById('audioPlayer');
    audio.src = filepath;
    audio.style.display = 'block';
    audio.play();
}
function stopSong() {
    const audio = document.getElementById('audioPlayer');
    audio.pause();
    audio.currentTime = 0;
}
function fetchPlaylist() {
    fetch('/list').then(r => r.json()).then(data => {
        // Desktop/tablet table
        const tbody = document.getElementById('playlistBody');
        tbody.innerHTML = '';
        // Mobile cards
        const mobileList = document.getElementById('mobileSongList');
        mobileList.innerHTML = '';
        data.songs.forEach((song, idx) => {
            const fileUrl = '/uploads/' + song.filepath.split('/').pop();
            // Table row (desktop/tablet)
            tbody.innerHTML += `<tr class="hover:bg-blue-50 transition-all">
                <td class='text-center font-semibold text-blue-800'>${song.index}</td>
                <td class='text-center text-gray-800'>${song.title}</td>
                <td class='text-center text-gray-800'>${song.artist}</td>
                <td class='text-center text-gray-700'>${song.duration}</td>
                <td class='text-center'>
                    <button class="btn btn-sm bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow me-1 mb-1" onclick="playSong('${fileUrl}')">Play</button>
                    <button class="btn btn-sm bg-red-500 hover:bg-red-600 text-white font-semibold rounded-lg shadow mb-1" onclick="deleteSong('${song.title}')">Delete</button>
                </td>
            </tr>`;
            // Card (mobile)
            mobileList.innerHTML += `
            <div class="card mb-3 shadow-lg rounded-xl border-0 bg-white">
                <div class="card-body p-3 flex flex-col items-center">
                    <div class="mb-2 flex flex-col items-center">
                        <span class="badge bg-blue-600 text-white text-lg mb-1">${song.index}</span>
                        <span class="fw-bold text-lg text-blue-800">${song.title}</span>
                    </div>
                    <div class="mb-2 flex flex-row justify-center gap-2">
                        <button class="btn btn-sm bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow" onclick="playSong('${fileUrl}')">Play</button>
                        <button class="btn btn-sm bg-red-500 hover:bg-red-600 text-white font-semibold rounded-lg shadow" onclick="deleteSong('${song.title}')">Delete</button>
                    </div>
                    <div class="mb-1 text-center text-gray-600"><span class="font-semibold">Artist:</span> ${song.artist}</div>
                    <div class="mb-1 text-center text-gray-600"><span class="font-semibold">Duration:</span> ${song.duration} sec</div>
                </div>
            </div>`;
        });
    });
}
function addSong(e) {
    e.preventDefault();
    const title = document.getElementById('title').value;
    const artist = document.getElementById('artist').value;
    const duration = document.getElementById('duration').value;
    const fileInput = document.getElementById('file');
    const file = fileInput.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append('file', file);
    fetch('/upload', {
        method: 'POST',
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        if (data.filepath) {
            fetch('/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, artist, duration, filepath: data.filepath })
            }).then(r => r.json()).then(() => {
                fetchPlaylist();
                document.getElementById('addSongForm').reset();
                var modal = bootstrap.Modal.getInstance(document.getElementById('addModal'));
                modal.hide();
            });
        } else {
            alert('File upload failed: ' + (data.error || 'Unknown error'));
        }
    });
}
function deleteSong(title) {
    fetch('/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
    }).then(r => r.json()).then(() => fetchPlaylist());
}
function shuffle() {
    fetch('/shuffle', { method: 'POST' }).then(() => fetchPlaylist());
}
function sortTitle() {
    fetch('/sort_title', { method: 'POST' }).then(() => fetchPlaylist());
}
function sortArtist() {
    fetch('/sort_artist', { method: 'POST' }).then(() => fetchPlaylist());
}
document.getElementById('addSongForm').addEventListener('submit', addSong);
window.onload = fetchPlaylist;
</script>
</body>
</html>
